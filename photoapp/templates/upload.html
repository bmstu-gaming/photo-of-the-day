<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photo</title>
    <link rel="stylesheet" href="/static/css/upload-form.css">
    <link rel="stylesheet" href="/static/css/common.css">
    <script src="/static/js/image_upload.js"></script>
</head>
<body>
    {% include 'top_bar.html' %}

    {% if not user %}
    <div class="error-message">
        You need to log in to upload photos!
        <a class="nav-link" href="/home">Login</a>
    </div>
    {% else %}
    
    <div class="upload-container">
        <form id="uploadForm">
            <div class="form-group">
                <label for="photoTitle">Photo Title</label>
                <input type="text" id="photoTitle" required>
            </div>

            <div class="form-group">
                <label>Select Photo</label>
                <div class="file-drop-zone" id="dropZone">
                    <p>Drag and drop photo here or click to upload</p>
                    <input type="file" id="fileInput" accept="image/*" hidden>
                </div>
                <div id="preview"></div>
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" rows="4" required></textarea>
            </div>

            <button type="submit" class="upload-button">Add to Gallery</button>
        </form>
    </div>
    {% endif %}
</body>
</html>
