<!DOCTYPE html>
<html>
    <head>
        <title>Discord OAuth2 with FastAPI</title>
    </head>
    <body>
        {% if user %}
            <h2>Welcome, {{ user['username'] }}#{{ user['discriminator'] }}</h2>
            <img src="https://cdn.discordapp.com/avatars/{{ user['id'] }}/{{ user['avatar'] }}.png" alt="Avatar" />
            <p>Email: {{ user.get('email') }}</p>
            <a href="/discord/logout">Logout</a>
        {% else %}
            <h2>Not logged in</h2>
            <a href="discord/login">Login with Discord</a>
        {% endif %}
    </body>
</html>
